name: Fix Credit Date Predicates

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/credits-ledger' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/credits-ledger
      - name: Replace raw Date interpolation with typed Drizzle predicates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/platform/credits/application/credit-service.ts')
          s = p.read_text()
          s = s.replace(
            'import { and, eq, inArray, isNull, lte, or, sql } from "drizzle-orm";',
            'import { and, eq, gt, gte, inArray, isNull, lte, or, sql } from "drizzle-orm";',
          )
          s = s.replace(
            'sql`${creditReservations.expiresAt} > ${now}`',
            'gt(creditReservations.expiresAt, now)',
          )
          s = s.replace(
            'or(isNull(creditGrants.expiresAt), sql`${creditGrants.expiresAt} >= ${input.expiresAt}`)',
            'or(isNull(creditGrants.expiresAt), gte(creditGrants.expiresAt, input.expiresAt))',
          )
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/credits/application/credit-service.ts
          git commit -m "fix: use typed credit timestamp predicates"
          git push origin HEAD:feat/credits-ledger
