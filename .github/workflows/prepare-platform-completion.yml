name: Prepare platform completion branch

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/seo-performance-i18n-platform-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply repository formatter
        run: bun run format
      - name: Generate Drizzle migration from schema
        run: bun run db:generate
      - name: Commit generated mechanical changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No mechanical changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format code and generate Drizzle migration"
          git push origin HEAD:${{ github.head_ref }}
