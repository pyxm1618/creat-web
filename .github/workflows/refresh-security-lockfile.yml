name: Refresh security lockfile

on:
  push:
    branches:
      - fix/dependency-security-audit-2026-10

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-security-audit-2026-10
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Refresh patched dependency resolutions
        run: |
          bun install --lockfile-only
          bun audit fix --ignore GHSA-vfj7-8cjw-p6xm
          bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
          bun audit --prod --audit-level=high
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-security-lockfile.yml
          git add package.json bun.lock
          git commit -m "chore(security): refresh patched dependency lockfile"
          git push
