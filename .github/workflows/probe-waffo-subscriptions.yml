name: Probe Waffo Subscriptions

on:
  push:
    branches: [feat/subscriptions-refunds]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Inspect subscription and refund SDK surface
        run: |
          echo '=== event data types ==='
          grep -R -n -E -A 35 -B 5 "Subscription.*EventData|subscription\.activated|subscription\.payment_succeeded|subscription\.past_due|subscription\.canceling|subscription\.uncanceled|subscription\.canceled" node_modules/@waffo/pancake-ts/dist | head -650
          echo '=== methods ==='
          grep -R -n -E -A 35 -B 8 "cancel.*subscription|uncancel|resume|refund.*ticket|createRefund|subscription.*cancel" node_modules/@waffo/pancake-ts/dist | head -650
