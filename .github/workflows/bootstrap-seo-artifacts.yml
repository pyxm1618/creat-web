name: Bootstrap SEO Artifacts

on:
  push:
    branches: [feat/seo-home-legal]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_generate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Update exact dependency lock
        run: bun install
      - name: Generate Drizzle migration
        run: bun run db:generate
      - name: Format generated and source files
        run: bun run format
      - name: Commit generated artifacts and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock drizzle src tests scripts package.json docs
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: generate SEO legal artifacts"
            git push origin HEAD:feat/seo-home-legal
          fi
