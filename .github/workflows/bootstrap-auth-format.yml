name: Bootstrap authentication formatting

on:
  push:
    branches: ["feat/authentication"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "next.config.ts"
      - "vercel.json"
      - ".env.example"
      - ".github/workflows/bootstrap-auth-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authentication
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format authentication fixes"
          git push origin HEAD:feat/authentication
