name: Bootstrap final authentication formatting

on:
  push:
    branches: ["feat/authentication"]
    paths:
      - src/platform/accounts/better-auth-identity-deletion.ts
      - tests/integration/accounts/account-deletion-session-revocation.test.ts
      - .github/workflows/bootstrap-auth-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authentication
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: >-
          bunx prettier --write
          src/platform/accounts/better-auth-identity-deletion.ts
          tests/integration/accounts/account-deletion-session-revocation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/accounts/better-auth-identity-deletion.ts tests/integration/accounts/account-deletion-session-revocation.test.ts
          git commit -m "style: format final authentication files"
          git push origin HEAD:feat/authentication
