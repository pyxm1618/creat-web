name: Supply-chain lockfile remediation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/seo-performance-i18n-platform-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Resolve pinned secure dependency graph
        run: bun install
      - name: Verify high and critical audit gate
        run: bun audit --audit-level=high
      - name: Commit lockfile only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git commit -m "chore: lock secure transitive dependency versions"
          git push origin HEAD:${{ github.head_ref }}
