name: Probe Waffo Short ID

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'feat/commerce-one-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Inspect SDK short ID constants
        run: |
          grep -n -E -A 8 -B 8 "SHORT_ID_REGEX|SHORT_ID_LABELS" node_modules/@waffo/pancake-ts/dist/index.js | head -120
