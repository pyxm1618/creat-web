name: Bootstrap Commerce Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feat/commerce-one-time' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_generate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-one-time
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run format
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle src tests scripts package.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: regenerate complete commerce migration"
            git push origin HEAD:feat/commerce-one-time
          fi
