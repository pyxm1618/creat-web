name: Probe Waffo Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'feat/commerce-one-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Inspect checkout and webhook implementations
        run: |
          echo '=== checkoutUrl/sessionId references ==='
          grep -n -E -A 25 -B 25 "checkoutUrl|sessionId" node_modules/@waffo/pancake-ts/dist/index.js | head -260
          echo '=== webhook verify references ==='
          grep -n -E -A 50 -B 30 "webhooks.verify|verify\(payload|createVerify|webhookPublicKey|x-waffo-signature" node_modules/@waffo/pancake-ts/dist/index.js | tail -320
